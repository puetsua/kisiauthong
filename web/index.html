<!DOCTYPE html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2a1740">
<title>記數通 KiSiauThong</title>
<link rel="stylesheet" href="style.css?v=40">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span lang="nan-Hant-TW">記數通</span><small>KiSiauThong</small></div>
    <nav id="nav" data-i18n-aria="Main">
      <a href="#dashboard" data-screen="dashboard" data-i18n="Dashboard">Dashboard</a>
      <a href="#transactions" data-screen="transactions" data-i18n="Transactions">Transactions</a>
      <a href="#accounts" data-screen="accounts" data-i18n="Accounts">Accounts</a>
      <a href="#moneyboxes" data-screen="moneyboxes" data-i18n="Money boxes">Money boxes</a>
      <a href="#templates" data-screen="templates" data-i18n="Templates">Templates</a>
      <a href="#tags" data-screen="tags" data-i18n="Tags">Tags</a>
      <a href="#settings" data-screen="settings" data-i18n="Settings">Settings</a>
    </nav>
    <div class="sidefoot"><a href="#settings">記數通 · AGPL-3.0-or-later</a></div>
  </aside>

  <div class="content">
    <header class="topbar">
      <button id="menuBtn" class="iconbtn" data-i18n-aria="Menu">☰</button>
      <h1 id="pageTitle"></h1>
      <div class="topactions">
        <button id="bellBtn" class="iconbtn bell" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="notifPanel"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="badge" hidden></span></button>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<!-- page level, so it layers above the sticky navigation on phones; placed under the bell by app.js -->
<div id="notifPanel" class="notifpanel" role="dialog" data-i18n-aria="Notifications" hidden></div>

<button id="addBtn" class="fab" type="button" data-i18n-aria="Add transaction" data-i18n-title="Add transaction"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>

<!-- Transaction drawer -->
<div id="drawerBackdrop" class="backdrop" hidden></div>
<aside id="drawer" class="drawer" hidden data-i18n-aria="Transaction editor">
  <div class="drawerhead"><h2 id="drawerTitle"></h2><button id="drawerClose" class="iconbtn" data-i18n-aria="Close">✕</button></div>
  <form id="txnForm">
    <p id="fPlannedNote" class="formnote planned" hidden></p>
    <div class="seg" id="typeSeg" role="tablist">
      <button type="button" data-type="expense" class="on" data-i18n="Expense">Expense</button><button type="button" data-type="income" data-i18n="Income">Income</button><button type="button" data-type="transfer" data-i18n="Transfer">Transfer</button><button type="button" data-type="allocate" data-i18n="Allocate">Allocate</button>
    </div>
    <label><span id="fAccountLab">Account</span> <select name="accountId" id="fAccount"></select></label>
    <label id="fExtWrap" hidden><span id="fExtLab">Paid to</span> <select name="extAccountId" id="fExt"></select></label>
    <label id="fToWrap" hidden><span data-i18n="To account">To account</span> <select name="toAccountId" id="fToAccount"></select></label>
    <p id="fToNone" class="formnote" hidden></p>
    <label><span data-i18n="Amount">Amount</span> <input name="amount" type="number" step="0.01" min="0.01" required inputmode="decimal"></label>
    <p id="fAmtNote" class="formnote hint" hidden data-i18n="A negative amount takes money back out of the money box.">A negative amount takes money back out of the money box.</p>
    <label><span data-i18n="Date">Date</span> <input name="date" type="date" required></label>
    <label id="fTagWrap"><span id="fTagLab">Tag</span> <select name="tagId" id="fTag"></select></label>
    <label><span data-i18n="Title">Title</span> <input name="note" maxlength="200" data-i18n-placeholder="Groceries"></label>
    <label><span data-i18n="Note">Note</span> <textarea name="memo" rows="3" maxlength="4000" data-i18n-placeholder="Details worth remembering: who, why, receipt number…"></textarea></label>
    <button class="primarybtn big" type="submit" data-i18n="Save transaction">Save transaction</button>
  </form>
</aside>

<!-- Generic create dialog -->
<dialog id="dialog">
  <form method="dialog" class="dialoghead"><h2 id="dialogTitle"></h2><button class="iconbtn" value="cancel" data-i18n-aria="Close">✕</button></form>
  <div id="dialogBody"></div>
</dialog>

<script src="i18n.js?v=40"></script>
<script src="app.js?v=40"></script>
</body>
</html>
