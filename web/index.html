<!DOCTYPE html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2a1740">
<title>記數通 KiSiauThong</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="記數通">
<link rel="stylesheet" href="style.css?v=117">
</head>
<body>
<div id="authScreen" class="authscreen" hidden></div>
<div class="shell" hidden>
  <aside class="sidebar">
    <div class="brand"><span lang="nan-Hant-TW">記數通</span><small>KiSiauThong</small></div>
    <nav id="nav" data-i18n-aria="Main">
      <a href="#dashboard" data-screen="dashboard" data-i18n="Dashboard">Dashboard</a>
      <a href="#transactions" data-screen="transactions" data-i18n="Transactions">Transactions</a>
      <a href="#accounts" data-screen="accounts" data-i18n="Accounts">Accounts</a>
      <a href="#templates" data-screen="templates" data-i18n="Templates">Templates</a>
      <a href="#tags" data-screen="tags" data-i18n="Tags">Tags</a>
      <a href="#reserves" data-screen="reserves" data-i18n="Reserves">Reserves</a>
      <a href="#settings" data-screen="settings" data-i18n="Settings">Settings</a>
    </nav>
    <nav id="adminNav" data-i18n-aria="Administration" hidden>
      <div class="navhead" data-i18n="Administration">Administration</div>
      <a href="#admin" data-screen="admin" data-i18n="Server">Server</a>
      <a href="#admin/users" data-screen="admin/users" data-i18n="Users">Users</a>
    </nav>
    <a id="sideAdmin" class="sideadmin" href="#admin" hidden></a>
    <div class="sidefoot"><a href="#settings">記數通 · AGPL-3.0-or-later</a></div>
  </aside>

  <div class="content">
    <header class="topbar">
      <button id="menuBtn" class="iconbtn" data-i18n-aria="Menu">☰</button>
      <h1 id="pageTitle"></h1>
      <div class="topactions">
        <button id="hideBtn" class="iconbtn eyebtn" type="button" aria-pressed="false"><svg class="eye-open" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg><svg class="eye-shut" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9.9 4.24A9 9 0 0 1 12 4c6.4 0 10 8 10 8a18 18 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24M17.94 17.94A10 10 0 0 1 12 20c-6.4 0-10-8-10-8a18 18 0 0 1 5.06-5.94M2 2l20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button id="bellBtn" class="iconbtn bell" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="notifPanel"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="badge" hidden></span></button>
        <button id="userBtn" class="userbtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="userMenu"></button>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>
  <!-- phones: the main pages at the thumb; the rest under More -->
  <nav id="tabbar" class="tabbar" data-i18n-aria="Main">
    <a href="#dashboard" data-tab="dashboard"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="Dashboard">Dashboard</span></a>
    <a href="#transactions" data-tab="transactions"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="Transactions">Transactions</span></a>
    <button type="button" id="tabAdd" class="tabadd" data-i18n-aria="Add transaction"><span><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span></button>
    <a href="#accounts" data-tab="accounts"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18v3M3 7.5V17a2 2 0 0 0 2 2h15V8H5.5A2.5 2.5 0 0 1 3 7.5M16 13.5h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="Accounts">Accounts</span></a>
    <button type="button" id="tabMore" aria-haspopup="dialog" aria-expanded="false" aria-controls="moreSheet"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="More">More</span></button>
  </nav>
</div>
<div id="moreBack" class="sheetback" hidden></div>
<div id="moreSheet" class="moresheet" role="dialog" data-i18n-aria="More" hidden>
  <a href="#templates" data-tab="templates"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M17 2l3 3-3 3M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 0 1-4 4H4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="Templates">Templates</span></a>
  <a href="#tags" data-tab="tags"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9zM7.5 7.5h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="Tags">Tags</span></a>
  <a href="#reserves" data-tab="reserves"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 4h18v4H3zM5 8v12h14V8M10 12h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="Reserves">Reserves</span></a>
  <a href="#settings" data-tab="settings"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M14 4v4M8 10v4M16 16v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="Settings">Settings</span></a>
  <div id="moreAdmin" hidden>
    <div class="navhead" data-i18n="Administration">Administration</div>
    <a href="#admin" data-tab="admin"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="Server">Server</span></a>
    <a href="#admin/users" data-tab="admin/users"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M16 20v-1a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v1M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M20 20v-1a4 4 0 0 0-3-3.9M15 3.1a4 4 0 0 1 0 7.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="Users">Users</span></a>
  </div>
  <div id="moreVer" class="morever"></div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<!-- page level, so it layers above the sticky navigation on phones; placed under the bell by app.js -->
<div id="notifPanel" class="notifpanel" role="dialog" data-i18n-aria="Notifications" hidden></div>
<div id="userMenu" class="usermenu" role="menu" hidden></div>

<button id="addBtn" class="fab" type="button" data-i18n-aria="Add transaction" data-i18n-title="Add transaction"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>

<!-- Transaction drawer -->
<div id="drawerBackdrop" class="backdrop" hidden></div>
<aside id="drawer" class="drawer" hidden data-i18n-aria="Transaction editor">
  <div class="drawerhead"><h2 id="drawerTitle"></h2><button id="drawerClose" class="iconbtn" data-i18n-aria="Close">✕</button></div>
  <form id="txnForm">
    <p id="fPlannedNote" class="formnote planned" hidden></p>
    <div id="fSchedNote" class="formnote sched" role="status" hidden><b id="fSchedHead"></b><span id="fSchedText"></span><br><button type="button" id="fPostNow" class="smallbtn" data-i18n="Post now">Post now</button></div>
    <div class="seg" id="typeSeg" role="tablist">
      <button type="button" data-type="expense" class="on" data-i18n="Expense">Expense</button><button type="button" data-type="income" data-i18n="Income">Income</button><button type="button" data-type="transfer" data-i18n="Transfer">Transfer</button>
    </div>
    <div id="fQuick" class="quickbox" hidden></div>
    <label id="fAccWrap"><span id="fAccountLab">Account</span> <select name="accountId" id="fAccount"></select></label>
    <label id="fExtWrap" hidden><span id="fExtLab">Paid to</span> <select name="extAccountId" id="fExt"></select></label>
    <label id="fToWrap" hidden><span data-i18n="To account">To account</span> <select name="toAccountId" id="fToAccount"></select></label>
    <p id="fToNone" class="formnote" hidden></p>
    <label id="fAmtWrap"><span data-i18n="Amount">Amount</span> <input name="amount" type="number" step="any" min="0.01" required inputmode="decimal"></label>
    <div class="daterow"><label><span data-i18n="Date">Date</span> <input name="date" type="date" required></label><div class="timenow"><label><span data-i18n="Time">Time</span> <input name="time" type="time"></label><button type="button" id="fNowBtn" class="iconbtn nowbtn" data-i18n-aria="Fill in current date and time" data-i18n-title="Fill in current date and time"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.84 8.2A9 9 0 1 1 5.64 18.36"/><path d="M3.55 4.81L3.84 8.2L6.63 6.25"/><path d="M12 7.5V12l3 2"/></svg></button></div></div>
    <label id="fTzWrap"><span data-i18n="Time zone">Time zone</span> <select name="tz" id="fTz"></select></label>
    <div id="fCatsWrap" class="drawerfield" role="group" aria-labelledby="fCatsLab"><span id="fCatsLab" data-i18n="Tags">Tags</span><div id="fCats" class="tagpick"></div></div>
    <label id="fTitleWrap"><span data-i18n="Title">Title</span> <input name="note" maxlength="200" data-i18n-placeholder="Groceries"></label>
    <label id="fMemoWrap"><span data-i18n="Note">Note</span> <textarea name="memo" rows="3" maxlength="4000" data-i18n-placeholder="Details worth remembering: who, why, receipt number…"></textarea></label>
    <div class="saverow">
      <button class="primarybtn big" type="submit" data-i18n="Save transaction">Save transaction</button>
      <button type="button" class="morebtn" id="fMoreBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="fMoreMenu" data-i18n-aria="More actions" data-i18n-title="More actions"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg></button>
      <div id="fMoreMenu" class="actmenu" role="menu" hidden>
        <button type="button" role="menuitem" id="fSaveTpl" data-i18n="Save as template">Save as template</button>
        <button type="button" role="menuitem" id="fDelete" class="danger" data-i18n="Delete" hidden>Delete</button>
      </div>
    </div>
  </form>
</aside>

<!-- Generic create dialog -->
<dialog id="dialog">
  <form method="dialog" class="dialoghead"><h2 id="dialogTitle"></h2><button class="iconbtn" value="cancel" data-i18n-aria="Close">✕</button></form>
  <div id="dialogBody"></div>
</dialog>

<script src="i18n.js?v=117"></script>
<script src="app.js?v=117"></script>
</body>
</html>
