# Self-host 記數通 with Docker Compose:
#   docker compose -f deploy/docker-compose.yml up -d
# then open http://localhost:8080 (passkeys need https or localhost).
services:
  kisiauthong:
    image: ghcr.io/puetsua/kisiauthong:latest
    # or build from this checkout instead:
    # build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080" # loopback only; put an HTTPS reverse proxy in front for other devices
    volumes:
      - kisiauthong-data:/data
    environment:
      # the public address when served behind a reverse proxy (needed for passkeys)
      # KISIAUTHONG_ORIGIN: https://books.example.com
      TZ: Asia/Taipei

volumes:
  kisiauthong-data:
