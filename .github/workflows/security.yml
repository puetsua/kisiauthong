# SPDX-License-Identifier: AGPL-3.0-or-later
# Vulnerability scanning: on every push and pull request, and weekly so new
# advisories against unchanged code are caught too.
#  - govulncheck: known vulnerabilities in Go dependencies and the standard
#    library that the server's code actually reaches
#  - Trivy: the repository (dependencies, secrets, Dockerfile) and the built
#    image (OS packages and the binary)
#  - CodeQL: static analysis of the Go and JavaScript code (public repos)
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1" # Mondays 03:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: server/go.sum
      - name: Scan
        working-directory: server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  trivy-repo:
    name: Trivy (repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  trivy-image:
    name: Trivy (Docker image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Go version for the image
        id: go
        run: echo "version=$(go env GOVERSION | sed 's/^go//')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: kisiauthong:scan
          build-args: GO_VERSION=${{ steps.go.outputs.version }}
          cache-from: type=gha
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: kisiauthong:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  codeql:
    name: CodeQL (${{ matrix.language }})
    # free for public repositories; private ones need GitHub Advanced Security
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: stable
          cache-dependency-path: server/go.sum
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
