# SPDX-License-Identifier: AGPL-3.0-or-later
# Pushing a version tag (1.2.3, or 1.2.3-beta.1 for a pre-release; no "v") tests,
# builds the downloads for every platform, publishes the Docker image to
# ghcr.io and creates the GitHub release with the downloads attached.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+", "[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: server/go.sum
      - name: Go tests
        working-directory: server
        run: go test -count=1 ./...
      - name: Vulnerabilities
        working-directory: server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  binaries:
    name: Downloads
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: server/go.sum
      - run: bash scripts/build-release.sh "$GITHUB_REF_NAME" dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Go version for the image
        id: go
        run: echo "version=$(go env GOVERSION | sed 's/^go//')" >> "$GITHUB_OUTPUT"
      - name: Build time
        id: built
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # 1.2.3 and 1.2 always; latest only for a final release (no "-" in the tag)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=記數通 KiSiauThong
            org.opencontainers.image.description=Self-hosted personal bookkeeping
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.built.outputs.time }}
            GO_VERSION=${{ steps.go.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    needs: [binaries, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}"
          cat > notes.md <<EOF
          ## Install

          **Docker**

          \`\`\`sh
          docker run -d --name kisiauthong -p 127.0.0.1:8080:8080 -v kisiauthong-data:/data ${image}
          \`\`\`

          **Download**: pick the archive for your system below, unpack it and run \`kisiauthong\` (\`kisiauthong.exe\` on Windows), then open http://localhost:8080. Your data is kept in \`data/\` next to where you run it. \`SHA256SUMS\` lists the checksums.

          | System | File |
          |---|---|
          | Windows (most PCs) | \`windows-amd64.zip\` |
          | Windows on ARM | \`windows-arm64.zip\` |
          | macOS, Apple silicon | \`darwin-arm64.tar.gz\` |
          | macOS, Intel | \`darwin-amd64.tar.gz\` |
          | Linux, 64-bit PC / server | \`linux-amd64.tar.gz\` |
          | Linux, ARM 64-bit (Raspberry Pi 4/5 with 64-bit OS) | \`linux-arm64.tar.gz\` |
          | Linux, ARM 32-bit (older Raspberry Pi) | \`linux-armv7.tar.gz\` |

          EOF
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file notes.md --generate-notes $prerelease
