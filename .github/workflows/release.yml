# SPDX-License-Identifier: AGPL-3.0-or-later
# Pushing a version tag (1.2.3, or 1.2.3-beta.1 for a pre-release; no "v") tests,
# builds the downloads for every platform, publishes the Docker image to
# ghcr.io and creates the GitHub release with the downloads attached.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+", "[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: server/go.sum
      - name: Go tests
        working-directory: server
        run: go test -count=1 ./...
      - name: Vulnerabilities
        working-directory: server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  binaries:
    name: Downloads
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: server/go.sum
      - run: bash scripts/build-release.sh "$GITHUB_REF_NAME" dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Go version for the image
        id: go
        run: echo "version=$(go env GOVERSION | sed 's/^go//')" >> "$GITHUB_OUTPUT"
      - name: Build time
        id: built
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # 1.2.3 and 1.2 always; latest only for a final release (no "-" in the tag)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=記數通 KiSiauThong
            org.opencontainers.image.description=Self-hosted personal bookkeeping
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.built.outputs.time }}
            GO_VERSION=${{ steps.go.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    # The Android app (ADR 0020), signed with the release key from the secrets
    # ANDROID_KEYSTORE_BASE64 (the .jks file, base64) and ANDROID_KEYSTORE_PASSWORD.
    # Without them the release goes ahead with no Android app.
    name: Android app
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tauri
    steps:
      - uses: actions/checkout@v7
      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::No Android signing key in the secrets; this release has no Android app."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # a .properties value: escape backslashes and a leading space
          password=$(printf '%s' "$KEYSTORE_PASSWORD" | sed -e 's/\\/\\\\/g' -e 's/^ /\\ /')
          printf 'storeFile=%s\npassword=%s\nkeyAlias=kisiauthong\n' "$RUNNER_TEMP/release.jks" "$password" > src-tauri/gen/android/keystore.properties
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/tauri/package-lock.json
      - name: Rust, JDK and NDK
        if: steps.key.outputs.ok == 'true'
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Build
        if: steps.key.outputs.ok == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npm ci
          npx tauri android build --apk --config "{\"version\":\"$TAG\"}"
          mkdir -p "$GITHUB_WORKSPACE/dist-android"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "$GITHUB_WORKSPACE/dist-android/kisiauthong-app-$TAG-android.apk"
      - uses: actions/upload-artifact@v7
        if: steps.key.outputs.ok == 'true'
        with:
          name: android
          path: dist-android/
          if-no-files-found: error

  desktop:
    # The Windows and macOS apps (ADR 0024): a Windows setup .exe (NSIS) and a
    # universal macOS .dmg, neither code-signed yet. With the updater key in the
    # secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD
    # it also signs the update packages that latest.json points to; without
    # them the installers ship and installed apps get no update.
    name: Desktop app (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/tauri
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/tauri/package-lock.json
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          if [ "$RUNNER_OS" = macOS ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi
      - name: Updater key
        id: key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::No updater key in the secrets; the ${{ matrix.name }} app ships without updates."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
          SIGNED: ${{ steps.key.outputs.signed }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npx tauri build ${{ matrix.args }} --config "{\"version\":\"$TAG\",\"bundle\":{\"createUpdaterArtifacts\":$SIGNED}}" -- --locked
          out="$GITHUB_WORKSPACE/dist-desktop"
          mkdir -p "$out"
          if [ "$RUNNER_OS" = Windows ]; then
            b=src-tauri/target/release/bundle/nsis
            exe=$(ls "$b"/*-setup.exe)
            cp "$exe" "$out/kisiauthong-app-$TAG-windows-x64-setup.exe"
            if [ "$SIGNED" = true ]; then cp "$exe.sig" "$out/kisiauthong-app-$TAG-windows-x64-setup.exe.sig"; fi
          else
            b=src-tauri/target/universal-apple-darwin/release/bundle
            cp "$(ls "$b"/dmg/*.dmg)" "$out/kisiauthong-app-$TAG-macos.dmg"
            if [ "$SIGNED" = true ]; then
              cp "$b"/macos/*.app.tar.gz "$out/kisiauthong-app-$TAG-macos.app.tar.gz"
              cp "$b"/macos/*.app.tar.gz.sig "$out/kisiauthong-app-$TAG-macos.app.tar.gz.sig"
            fi
          fi
          ls -l "$out"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: dist-desktop/
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [binaries, docker, android, desktop]
    # a failed app build leaves that app out; it never holds back the server release
    if: ${{ !cancelled() && needs.binaries.result == 'success' && needs.docker.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v8
        # absent when the Android job had no signing key
        continue-on-error: true
        with:
          name: android
          path: dist
      - uses: actions/download-artifact@v8
        # absent when a desktop build failed
        continue-on-error: true
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Update manifest for the desktop apps
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/updater-manifest.js "$TAG" dist > latest.json
          if [ -s latest.json ]; then mv latest.json dist/; else rm latest.json; fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}"
          cat > notes.md <<EOF
          ## Install

          **Docker**

          \`\`\`sh
          docker run -d --name kisiauthong -p 127.0.0.1:8080:8080 -v kisiauthong-data:/data ${image}
          \`\`\`

          **Download**: pick the archive for your system below, unpack it and run \`kisiauthong\` (\`kisiauthong.exe\` on Windows), then open http://localhost:8080. Your data is kept in \`data/\` next to where you run it. \`SHA256SUMS\` lists the checksums.

          | System | File |
          |---|---|
          | Windows (most PCs) | \`windows-amd64.zip\` |
          | Windows on ARM | \`windows-arm64.zip\` |
          | macOS, Apple silicon | \`darwin-arm64.tar.gz\` |
          | macOS, Intel | \`darwin-amd64.tar.gz\` |
          | Linux, 64-bit PC / server | \`linux-amd64.tar.gz\` |
          | Linux, ARM 64-bit (Raspberry Pi 4/5 with 64-bit OS) | \`linux-arm64.tar.gz\` |
          | Linux, ARM 32-bit (older Raspberry Pi) | \`linux-armv7.tar.gz\` |

          EOF
          rows=""
          win="kisiauthong-app-${TAG}-windows-x64-setup.exe" mac="kisiauthong-app-${TAG}-macos.dmg"
          if [ -f "dist/$win" ]; then rows+="| Windows 10/11 | \`$win\` |"$'\n'; fi
          if [ -f "dist/$mac" ]; then rows+="| macOS 12+ (Apple silicon and Intel) | \`$mac\` |"$'\n'; fi
          for f in "$win" "$mac"; do
            if [ -f "dist/$f" ]; then (cd dist && sha256sum "$f" >> SHA256SUMS); fi
          done
          if [ -n "$rows" ]; then
            cat >> notes.md <<EOF
          **Desktop app** (opens your own server):

          | System | File |
          |---|---|
          ${rows}
          The desktop apps are not code-signed yet. Windows SmartScreen warns once: More info → Run anyway. macOS blocks the first launch: allow it in System Settings → Privacy & Security → Open Anyway. Installed apps update from Settings → About → Check for updates.

          EOF
          fi
          if [ -f "dist/kisiauthong-app-${TAG}-android.apk" ]; then
            (cd dist && sha256sum "kisiauthong-app-${TAG}-android.apk" >> SHA256SUMS)
            cat >> notes.md <<EOF
          **Android app**: \`kisiauthong-app-${TAG}-android.apk\` opens your own server. Once installed, it updates itself from Settings → About → Check for updates.

          EOF
          fi
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file notes.md --generate-notes $prerelease
