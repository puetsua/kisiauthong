# SPDX-License-Identifier: AGPL-3.0-or-later
# Tests on every push and pull request: Go server, web UI checks, the OpenAPI
# spec, and the Docker image actually starting and answering.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Go server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go vet (release build)
        run: |
          cp -r ../web ./web
          go vet -tags embedweb ./...
          rm -rf ./web
      - name: Tests
        run: go test -race -count=1 ./...

  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Syntax
        run: for f in web/*.js scripts/*.js apps/tauri/src/*.js apps/tauri/src-tauri/src/*.js; do node --check "$f"; done
      - name: Translations complete
        run: node scripts/check-i18n.js
      - name: Rendering smoke tests
        run: node scripts/test-web.js
      - name: Themes (tokens, WCAG contrast, theme.js)
        run: node scripts/test-themes.js
      - name: Number formats
        run: node scripts/check-numfmt.js
      - name: App server screen (apps/tauri)
        run: node scripts/test-app.js

  openapi:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # Spectral's recommended OpenAPI rules (.spectral.yaml), warnings fail too.
      # The Go job's TestOpenAPICoversRoutes checks the spec against the routes.
      - name: Spectral
        run: npx --yes @stoplight/spectral-cli@6.17.0 lint api/openapi.yaml --fail-severity=warn

  release-build:
    name: Release builds compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: server/go.sum
      - run: bash scripts/build-release.sh ci-${{ github.run_number }} "$RUNNER_TEMP/dist"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build time
        id: built
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: kisiauthong:ci
          build-args: |
            VERSION=ci-${{ github.run_number }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.built.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Starts, stays healthy and serves the app
        run: |
          docker run -d --name kst -p 127.0.0.1:8080:8080 kisiauthong:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' kst)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' kst | grep -qx healthy
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ | grep -q '<title>'
          curl -fsS http://127.0.0.1:8080/api/auth/status | grep -q '"needsSetup":true'
          docker exec kst /kisiauthong version
      - name: Logs
        if: always()
        run: docker logs kst || true
