# Permission sets of the app's own commands (ADR 0019).

[[set]]
identifier = "server-screen"
description = "The bundled server screen: read the saved servers, check an address, save a server, go back, check for and install an app update, and turn the check at launch on or off."
permissions = ["allow-app-state", "allow-probe", "allow-save-server", "allow-cancel-form", "allow-update-check", "allow-update-install", "allow-update-settings"]

[[set]]
identifier = "bridge"
description = "What a saved server's web UI may ask of the app: list, switch to, remove servers, open the add or edit screen, open a link in the system browser, ask a yes/no question in a native dialog, read the app's version, and open the App updates screen."
permissions = ["allow-servers", "allow-use-server", "allow-remove-server", "allow-open-server-form", "allow-open-external", "allow-confirm", "allow-app-info", "allow-open-updates"]
