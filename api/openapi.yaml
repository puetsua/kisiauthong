#
# The HTTP API contract (AGENTS.md §2, §5): every route server/main.go
# registers (newMux), with the methods its handlers answer. TestOpenAPICoversRoutes
# (server/openapi_test.go) checks this file against the real route table, and CI
# lints it with Spectral (in api/: npm ci && npm run lint). Change it together
# with the handler.
openapi: 3.1.0
info:
  title: kisiauthong API
  version: "1"
  description: >-
    The REST/JSON API of a kisiauthong server. A browser signs in and holds
    the kst_session cookie; scripts send an API key as a Bearer token (ADR
    0008), limited to the scopes it was given (each operation's
    x-api-key-scope). Account management (sign-in methods, API keys,
    users) takes the session only, never a key. With the session cookie, any
    method but GET whose Origin header names another host is refused with
    403. Every error is JSON {"error": "…"} in English. A method a path does
    not serve answers 405 or 404 {"error": "not found"}; on some paths with
    an id, an unknown id answers its own 404 first. Amounts are integer minor units of their currency, dates the
    user's local YYYY-MM-DD.
  contact:
    name: kisiauthong
    url: https://github.com/puetsua/kisiauthong
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: /
    description: The server itself (under its base path when KISIAUTHONG_BASE_PATH is set).
tags:
  - { name: health, description: For Docker and orchestrators. }
  - { name: auth, description: "Signing in and out (ADR 0007)." }
  - { name: me, description: "The signed-in user's own account: profile, password, two-step verification, passkeys, photo and API keys." }
  - { name: admin, description: Administrators manage users and see the server. }
  - { name: settings, description: The signed-in user's settings. }
  - { name: books, description: "The whole book: state, export and live change events." }
  - { name: accounts, description: "Own and external accounts (ADR 0002, 0005)." }
  - { name: tags, description: "Categories and budgets (ADR 0004), and merging them (ADR 0017)." }
  - { name: reserves, description: "Reserves and their allocations (ADR 0013)." }
  - { name: transactions, description: "Money movements (ADR 0013, 0014)." }
  - { name: templates, description: Transaction templates and generating what is due. }
  - { name: mcp, description: "The Model Context Protocol endpoint for AI agents (ADR 0008)." }
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: Health check
      description: Always at the root, also under a base path. It answers any method the same way.
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: { status: { type: string, const: ok } }

  /api/auth/status:
    get:
      tags: [auth]
      operationId: getAuthStatus
      summary: Whether setup is needed, and who is signed in
      description: Public. It answers any method the same way.
      security: []
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                type: object
                required: [needsSetup, user]
                properties:
                  needsSetup: { type: boolean, description: "True until the first user exists." }
                  user:
                    description: The user of the session cookie, null when nobody is signed in.
                    oneOf: [{ $ref: "#/components/schemas/User" }, { type: "null" }]
        "500": { $ref: "#/components/responses/Error" }
  /api/auth/setup:
    post:
      tags: [auth]
      operationId: setUp
      summary: Create the first user
      description: >-
        Only while no user can sign in. Creates the first user, an
        administrator (on a database from before users existed it claims the
        owner and their books), and signs them in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewCredentials" }
      responses:
        "201":
          description: The new user, signed in.
          headers: { Set-Cookie: { $ref: "#/components/headers/SessionCookie" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/auth/login:
    post:
      tags: [auth]
      operationId: logIn
      summary: Sign in with a username and password
      description: >-
        When the user has two-step verification on, the answer is a ticket
        for POST /api/auth/totp instead of a session. Ten failures from one
        address within 15 minutes answer 429.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Signed in (the user), or the password passed and a code is needed.
          headers: { Set-Cookie: { $ref: "#/components/headers/SessionCookie" } }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/User" }
                  - { $ref: "#/components/schemas/TOTPRequired" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/auth/totp:
    post:
      tags: [auth]
      operationId: logInWithCode
      summary: Finish signing in with a two-step code or a recovery code
      description: "The second step after POST /api/auth/login answered totpRequired. A wrong code or an expired ticket answers 401; a used recovery code is gone."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, code]
              properties:
                ticket: { type: string, description: "From POST /api/auth/login; valid 5 minutes and 5 tries." }
                code: { type: string, description: "A 6-digit code, or an unused recovery code." }
      responses:
        "200":
          description: Signed in.
          headers: { Set-Cookie: { $ref: "#/components/headers/SessionCookie" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/auth/passkey:
    post:
      tags: [auth]
      operationId: logInWithPasskey
      summary: Sign in with a passkey
      description: >-
        Without token: begins, answering the WebAuthn request options and a
        token. With token: finishes, with the browser's assertion
        (PublicKeyCredential JSON) as the body. Passkeys need a host name,
        not an IP address.
      security: []
      parameters:
        - name: token
          in: query
          required: false
          description: The token the begin step gave.
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebAuthnCredential" }
      responses:
        "200":
          description: Begun (token and options) or signed in (the user).
          headers: { Set-Cookie: { $ref: "#/components/headers/SessionCookie" } }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/WebAuthnCeremony" }
                  - { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logOut
      summary: Sign out this session
      description: Ends the session of the cookie, if any, and clears the cookie.
      security: []
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/me:
    get:
      tags: [me]
      operationId: getMe
      summary: The signed-in user
      description: "The profile of the session's user. Session only."
      security: [{ session: [] }]
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      tags: [me]
      operationId: updateMe
      summary: Change the display name
      description: 'Only displayName can change here; "" shows the username.'
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, maxLength: 60, description: '"" shows the username.' }
      responses:
        "200":
          description: The user after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/me/password:
    post:
      tags: [me]
      operationId: changePassword
      summary: Change the password
      description: The user's other sessions are signed out. A wrong current password answers 403.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, new]
              properties:
                current: { type: string, format: password }
                new: { type: string, format: password, minLength: 8, maxLength: 200 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/me/totp/setup:
    post:
      tags: [me]
      operationId: setUpTOTP
      summary: Start turning on two-step verification
      description: Makes a new secret; POST /api/me/totp/enable with a code from it turns it on.
      security: [{ session: [] }]
      responses:
        "200":
          description: The secret, as text, as an otpauth URI and as a QR code.
          content:
            application/json:
              schema:
                type: object
                required: [secret, uri, qr]
                properties:
                  secret: { type: string, description: Base32. }
                  uri: { type: string, description: "otpauth://totp/…" }
                  qr: { type: string, description: "A data:image/png;base64 URL." }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/me/totp/enable:
    post:
      tags: [me]
      operationId: enableTOTP
      summary: Turn on two-step verification
      description: "With a current code from the secret POST /api/me/totp/setup made. 409 when setup was not started."
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeBody" }
      responses:
        "200":
          description: On; the recovery codes are shown this once.
          content:
            application/json:
              schema:
                type: object
                required: [recoveryCodes]
                properties:
                  recoveryCodes: { type: array, items: { type: string }, minItems: 10, maxItems: 10 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/me/totp/disable:
    post:
      tags: [me]
      operationId: disableTOTP
      summary: Turn off two-step verification
      description: Needs a current code or a recovery code; a wrong one answers 403.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeBody" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/me/passkeys:
    get:
      tags: [me]
      operationId: listPasskeys
      summary: The user's passkeys
      description: "Names and dates only; credentials never leave the server."
      security: [{ session: [] }]
      responses:
        "200":
          description: Oldest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Passkey" } }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      tags: [me]
      operationId: beginPasskey
      summary: Begin adding a passkey
      description: Answers WebAuthn creation options; POST /api/me/passkeys/finish completes it.
      security: [{ session: [] }]
      responses:
        "200":
          description: The token and the options for navigator.credentials.create.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnCeremony" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/me/passkeys/finish:
    post:
      tags: [me]
      operationId: finishPasskey
      summary: Finish adding a passkey
      description: "With the browser's new credential as the body; the token must come from this user's begin step."
      security: [{ session: [] }]
      parameters:
        - { name: token, in: query, required: true, description: From POST /api/me/passkeys., schema: { type: string } }
        - name: name
          in: query
          required: false
          description: 'Up to 60 characters; "Passkey" when empty or longer.'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebAuthnCredential" }
      responses:
        "201":
          description: The passkey.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/me/passkeys/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    delete:
      tags: [me]
      operationId: deletePasskey
      summary: Remove a passkey
      description: "404 when the user has no such passkey."
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/me/avatar:
    put:
      tags: [me]
      operationId: updateAvatar
      summary: Set the photo and / or the colour
      description: "image replaces the photo, color the colour shown without one; either may be left out."
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                image: { type: string, description: "A data: URL of a PNG or JPEG, 16 to 512 pixels a side, at most 512 KB." }
                color: { type: string, pattern: "^(#[0-9a-fA-F]{6})?$", description: '"" for the default colour.' }
      responses:
        "200":
          description: The user after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      tags: [me]
      operationId: deleteAvatar
      summary: Remove the photo
      description: "The colour stays."
      security: [{ session: [] }]
      responses:
        "200":
          description: The user after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/me/keys:
    get:
      tags: [me]
      operationId: listAPIKeys
      summary: The user's API keys
      description: "Names, hints, scopes and dates; never the secrets."
      security: [{ session: [] }]
      responses:
        "200":
          description: Newest first. The secrets are never shown again.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/APIKey" } }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      tags: [me]
      operationId: createAPIKey
      summary: Create an API key
      description: At most 50 keys per user (409). expiresOn wins over expiresInDays.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                scopes: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Scope" } }
                expiresInDays: { type: integer, minimum: 0, maximum: 3650, description: 0 never expires. }
                expiresOn: { type: string, format: date, description: "The last day it works, within 10 years." }
                tz: { type: string, description: "The IANA zone of expiresOn; UTC when empty." }
      responses:
        "201":
          description: The key; its secret is shown this once.
          content:
            application/json:
              schema:
                type: object
                required: [key, apiKey]
                properties:
                  key: { type: string, description: "The secret, kst_…" }
                  apiKey: { $ref: "#/components/schemas/APIKey" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/me/keys/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    delete:
      tags: [me]
      operationId: deleteAPIKey
      summary: Revoke an API key
      description: "Requests with it are refused from then on, open event streams included."
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/admin/server:
    get:
      tags: [admin]
      operationId: getServerInfo
      summary: The server and its database
      description: Administrators only.
      security: [{ session: [] }]
      x-admin-only: true
      responses:
        "200":
          description: The server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: Every user
      description: Administrators only.
      security: [{ session: [] }]
      x-admin-only: true
      responses:
        "200":
          description: Oldest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/User" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      operationId: createUser
      summary: Add a user with empty books
      description: Administrators only. 409 when the username is taken.
      security: [{ session: [] }]
      x-admin-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/NewCredentials" }
                - type: object
                  properties:
                    isAdmin: { type: boolean, default: false }
      responses:
        "201":
          description: The new user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/users/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [admin]
      operationId: updateUser
      summary: Change a user
      description: >-
        Administrators only. A new password signs the user out everywhere
        (unless it is the administrator's own). The last administrator cannot
        lose the role (409).
      security: [{ session: [] }]
      x-admin-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isAdmin: { type: boolean }
                password: { type: string, format: password, minLength: 8, maxLength: 200 }
                displayName: { type: string, maxLength: 60 }
      responses:
        "200":
          description: The user after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      operationId: deleteUser
      summary: Delete a user and all their books
      description: Administrators only; not themselves (409).
      security: [{ session: [] }]
      x-admin-only: true
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/users/{id}/avatar:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [me]
      operationId: getAvatar
      summary: A user's photo
      description: >-
        Any signed-in user, or any API key. Cached privately for a day; the
        URL a client builds carries User.avatarVersion.
      security: [{ session: [] }, { apiKey: [] }]
      responses:
        "200":
          description: The photo.
          content:
            image/png: { schema: { type: string, contentEncoding: binary } }
            image/jpeg: { schema: { type: string, contentEncoding: binary } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: The signed-in user's settings
      description: Every user has their own; a user never sees another's.
      security: [{ session: [] }, { apiKey: [] }]
      x-api-key-scope: read
      responses:
        "200":
          description: The settings, with defaults for anything never saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    put:
      tags: [settings]
      operationId: updateSettings
      summary: Change some settings
      description: >-
