  /mcp:
    post:
      tags: [mcp]
      operationId: mcp
      summary: Model Context Protocol (Streamable HTTP)
      description: >-
        One JSON-RPC 2.0 message per POST, answered with one JSON response;
        no event stream is opened. API keys only, never the session cookie.
        The tools (tools/list) depend on the key's scopes. Protocol errors
        are JSON-RPC errors with status 200. A notification (no id) answers
        202 with no body.
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { type: string, const: "2.0" }
                id: { type: [string, integer, "null"] }
                method: { type: string, examples: [initialize, tools/list, tools/call, ping] }
                params: { type: object }
      responses:
        "200":
          description: The JSON-RPC response.
          content:
            application/json:
              schema:
                type: object
                required: [jsonrpc, id]
                properties:
                  jsonrpc: { type: string, const: "2.0" }
                  id: { type: [string, integer, "null"] }
                  result: { type: object }
                  error:
                    type: object
                    required: [code, message]
                    properties: { code: { type: integer }, message: { type: string } }
        "202": { description: A notification was received. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: kst_session }
    apiKey:
      type: http
      scheme: bearer
      description: >-
        An API key, "Authorization: Bearer kst_…". x-api-key-scope on an
        operation names the scope the key needs; without it any key will do.
  parameters:
    id:
      name: id
      in: path
      required: true
      description: "The record's id."
      schema: { type: string }
  headers:
    SessionCookie:
      description: "kst_session, HttpOnly, SameSite=Lax, 30 days; Secure over HTTPS."
      schema: { type: string }
  responses:
    Error:
      description: What went wrong, in English.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties: { error: { type: string } }
    Ok:
      description: Done.
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties: { ok: { type: boolean, const: true } }
    Deleted:
      description: Deleted.
      content:
        application/json:
          schema:
            type: object
            required: [deleted]
            properties: { deleted: { type: string, description: The id. } }
  schemas:
    Scope:
      type: string
      enum: [read, "transactions:write", "accounts:write", "tags:write", "reserves:write", "templates:write", "settings:write"]
    NewCredentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{2,31}$" }
        password: { type: string, format: password, minLength: 8, maxLength: 200 }
        displayName: { type: string, maxLength: 60 }
    CodeBody:
      type: object
      required: [code]
      properties: { code: { type: string } }
    TOTPRequired:
      type: object
      required: [totpRequired, ticket]
      properties:
        totpRequired: { type: boolean, const: true }
        ticket: { type: string, description: For POST /api/auth/totp. }
    WebAuthnCeremony:
      type: object
      required: [token, options]
      properties:
        token: { type: string, description: Pass back on the finish step; valid for a few minutes. }
        options: { type: object, description: "The WebAuthn options ({publicKey: …})." }
    WebAuthnCredential:
      type: object
      description: The browser's PublicKeyCredential as JSON.
    User:
      type: object
      required: [id, username, displayName, isAdmin, totpEnabled, hasAvatar, avatarVersion, avatarColor, createdAt]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string, description: The username when none is set. }
        isAdmin: { type: boolean }
        totpEnabled: { type: boolean }
        recoveryCodesLeft: { type: integer, description: Only while two-step verification is on and codes are left. }
        hasAvatar: { type: boolean }
        avatarVersion: { type: integer }
        avatarColor: { type: string }
        createdAt: { type: string, format: date-time }
    Passkey:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, description: 'RFC 3339; "" in the answer of POST /api/me/passkeys/finish.' }
        lastUsedAt: { type: string, format: date-time }
    APIKey:
      type: object
      required: [id, name, hint, scopes, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        hint: { type: string, description: "The first and last characters, kst_AbC…xyz." }
        scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    ServerInfo:
      type: object
      required: [version, startedAt, runtime, database, users, admins, twoStepUsers, passkeys, activeSessions, apiKeys]
      properties:
        version: { type: string }
        startedAt: { type: string, format: date-time }
        runtime: { type: string, description: "The Go version and platform." }
        database:
          type: object
          required: [path, sizeBytes, schemaVersion]
          properties:
            path: { type: string }
            sizeBytes: { type: integer, format: int64 }
            schemaVersion: { type: integer }
        users: { type: integer }
        admins: { type: integer }
        twoStepUsers: { type: integer }
        passkeys: { type: integer }
        activeSessions: { type: integer }
        apiKeys: { type: integer, description: Keys that have not expired. }
    Account:
      type: object
      description: >-
        An own account (with a currency) or an external one (ADR 0002, 0005).
        An external account has no currency, opening balance or limit.
      required: [name]
      properties:
        id: { type: string, readOnly: true }
        name: { type: string, minLength: 1 }
        kind:
          type: string
          default: own
          description: >-
            own or external; always one of them in answers. The account types
            from before ADR 0005 (bank, savings, cash, credit_card, ewallet,
            investment, loan) are still accepted and become own with that icon.
        icon: { type: string, pattern: "^([a-z][a-z0-9_]{0,23})?$" }
        currency: { type: string, pattern: "^([A-Z]{3})?$", description: 'Required for an own account; "" on an external one.' }
        openingBalanceMinor: { type: integer, format: int64 }
        limitMinor: { type: integer, format: int64, exclusiveMinimum: 0 }
        statementCloseDay: { type: integer }
        paymentDueDay: { type: integer }
        memo: { type: string, maxLength: 4000 }
    AccountView:
      description: An account with what is derived from its transactions and allocations, as of today.
      allOf:
        - { $ref: "#/components/schemas/Account" }
        - type: object
          required: [id, kind, currency, openingBalanceMinor, balanceMinor, reservedMinor, freeMinor, heldMinor, incomingMinor]
          properties:
            balanceMinor: { type: integer, format: int64 }
            reservedMinor: { type: integer, format: int64 }
            freeMinor: { type: integer, format: int64, description: "balance − reserved − held." }
            heldMinor: { type: integer, format: int64, description: Scheduled transactions leaving it. }
            incomingMinor: { type: integer, format: int64, description: Scheduled transactions coming in. }
            projectedMinor: { type: integer, format: int64, description: Own accounts only. }
            nextHeldDate: { type: string, format: date }
            nextIncomingDate: { type: string, format: date }
            owedMinor: { type: integer, format: int64, description: "With a limit: max(0, −balance)." }
            utilisation: { type: number, description: "owed ÷ limit, for display only." }
    Transaction:
      type: object
      description: >-
        A money movement, stored as a transfer (ADR 0013). type expense or
        income with accountId is input only. A posted transaction dated after
        today is served as scheduled (ADR 0014); sent back, scheduled means
        posted.
      required: [type]
      properties:
        id: { type: string, readOnly: true }
        type: { type: string, enum: [transfer, expense, income], description: Always transfer once stored. }
        accountId: { type: string, writeOnly: true, description: "The own account of an expense or income shorthand." }
        fromAccountId: { type: string }
        toAccountId: { type: string }
        tagIds: { type: array, items: { type: string } }
        state: { type: string, enum: [posted, planned, scheduled], default: posted }
        amountMinor: { type: integer, format: int64, exclusiveMinimum: 0 }
        currency: { type: string, readOnly: true, description: "From the user's own account." }
        date: { type: string, format: date }
        time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        tz: { type: string, description: The IANA zone of time; required with time. }
        at: { type: string, format: date-time, readOnly: true, description: "The UTC instant of date, time and tz." }
        note: { type: string, maxLength: 200 }
        memo: { type: string, maxLength: 4000 }
        createdAt: { type: string, readOnly: true }
        transactionTemplateId: { type: string }
        occurrenceDate: { type: string, format: date }
    TransactionTag:
      type: object
      required: [transactionId, tagId]
      properties:
        transactionId: { type: string }
        tagId: { type: string }
    Tag:
      type: object
      description: A category; a budget when it has limitMinor (ADR 0004).
      required: [name]
      properties:
        id: { type: string, readOnly: true }
        name: { type: string, minLength: 1 }
        limitMinor: { type: integer, format: int64, exclusiveMinimum: 0 }
        cycle: { type: string, enum: [daily, weekly, monthly, yearly, range], default: monthly }
        cycleEvery: { type: integer, minimum: 0, maximum: 99, description: "Units per budget period; 0 means 1." }
        cycleStart: { type: string, format: date }
        cycleEnd: { type: string, format: date, description: Range budgets only. }
        currency: { type: string, pattern: "^[A-Z]{3}$", description: "A budget's currency; required with limitMinor." }
        memo: { type: string, maxLength: 4000 }
    TagView:
      type: object
      required: [id, name, currency]
      properties:
        id: { type: string }
        name: { type: string }
        currency: { type: string }
        memo: { type: string }
        limitMinor: { type: integer, format: int64 }
        cycle: { type: string }
        cycleEvery: { type: integer }
        cycleStart: { type: string }
        cycleEnd: { type: string }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        spentMinor: { type: integer, format: int64, description: "Net spending in the current period (ADR 0021)." }
        remainingMinor: { type: integer, format: int64 }
    Reserve:
      type: object
      required: [name, currency]
      properties:
        id: { type: string, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 100 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        targetMinor: { type: integer, format: int64, exclusiveMinimum: 0 }
        targetDate: { type: string, format: date }
    ReserveView:
      type: object
      required: [id, name, currency, targetDate, savedMinor, split]
      properties:
        id: { type: string }
        name: { type: string }
        currency: { type: string }
        targetMinor: { type: integer, format: int64 }
        targetDate: { type: string }
        savedMinor: { type: integer, format: int64 }
        split:
          type: array
          description: What it holds in each account (non-zero only).
          items:
            type: object
            required: [accountId, amountMinor, currency]
            properties:
              accountId: { type: string }
              amountMinor: { type: integer, format: int64 }
              currency: { type: string }
    Allocation:
      type: object
      description: "Money of an own account put into a reserve (+) or taken out (−); it moves no money."
      required: [accountId, amountMinor]
      properties:
        id: { type: string, readOnly: true }
        reserveId: { type: string }
        accountId: { type: string }
        amountMinor: { type: integer, format: int64, not: { const: 0 } }
        currency: { type: string, readOnly: true, description: "The account's." }
        date: { type: string, format: date }
        time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        tz: { type: string }
        at: { type: string, format: date-time, readOnly: true }
        note: { type: string, maxLength: 200 }
        memo: { type: string, maxLength: 4000 }
        createdAt: { type: string, readOnly: true }
        transactionTemplateId: { type: string, readOnly: true }
        occurrenceDate: { type: string, format: date, readOnly: true }
    TemplateBody:
      type: object
      description: What a template generates; allocate makes allocations into reserveId from accountId.
      required: [type, amountMinor]
      properties:
        type: { type: string, enum: [transfer, expense, income, allocate] }
        accountId: { type: string }
        fromAccountId: { type: string }
        toAccountId: { type: string }
        reserveId: { type: string }
        tagIds: { type: array, items: { type: string } }
        amountMinor: { type: integer, format: int64, exclusiveMinimum: 0 }
        expectedRangeMinor:
          type: object
          required: [min, max]
          properties:
            min: { type: integer, format: int64 }
            max: { type: integer, format: int64 }
        currency: { type: string, readOnly: true }
        note: { type: string }
    Schedule:
      type: object
      description: startDate is required unless frequency is never.
      properties:
        frequency: { type: string, enum: [daily, weekly, monthly, quarterly, yearly, never], default: monthly }
        interval: { type: integer, minimum: 1, default: 1 }
        dayOfMonth: { type: integer }
        weekday: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    TransactionTemplate:
      type: object
      required: [name, template, schedule]
      properties:
        id: { type: string, readOnly: true }
        name: { type: string, minLength: 1 }
        enabled: { type: boolean, readOnly: true, description: "New templates start enabled; POST …/toggle flips it." }
        template: { $ref: "#/components/schemas/TemplateBody" }
        schedule: { $ref: "#/components/schemas/Schedule" }
    TemplateView:
      allOf:
        - { $ref: "#/components/schemas/TransactionTemplate" }
        - type: object
          required: [id, enabled, nextDue]
          properties:
            nextDue: { type: string, description: 'The next occurrence from today, "" when none.' }
    State:
      type: object
      required: [accounts, transactions, tags, reserves, allocations, transactionTags, transactionTemplates, today, spendingThisMonth, rev]
      properties:
        accounts: { type: array, items: { $ref: "#/components/schemas/AccountView" } }
        transactions: { type: array, items: { $ref: "#/components/schemas/Transaction" } }
        tags: { type: array, items: { $ref: "#/components/schemas/TagView" } }
        reserves: { type: array, items: { $ref: "#/components/schemas/ReserveView" } }
        allocations: { type: array, items: { $ref: "#/components/schemas/Allocation" } }
        transactionTags: { type: array, items: { $ref: "#/components/schemas/TransactionTag" } }
        transactionTemplates: { type: array, items: { $ref: "#/components/schemas/TemplateView" } }
        today: { type: string, format: date, description: "The user's today." }
        spendingThisMonth:
          type: array
          items:
            type: object
            required: [tagId, currency, amountMinor]
            properties:
              tagId: { type: string }
              currency: { type: string }
              amountMinor: { type: integer, format: int64 }
        rev: { type: string, description: "The live revision; compare with /api/events for equality only." }
    BookData:
      type: object
      description: The plain JSON seed/import/export format (examples/sample-data.json).
      required: [version, accounts, transactions, tags, transactionTags, transactionTemplates, reserves, allocations]
      properties:
        version: { type: integer }
        accounts: { type: array, items: { $ref: "#/components/schemas/Account" } }
        transactions: { type: array, items: { $ref: "#/components/schemas/Transaction" } }
        tags: { type: array, items: { $ref: "#/components/schemas/Tag" } }
        transactionTags: { type: array, items: { $ref: "#/components/schemas/TransactionTag" } }
        transactionTemplates: { type: array, items: { $ref: "#/components/schemas/TransactionTemplate" } }
        reserves: { type: array, items: { $ref: "#/components/schemas/Reserve" } }
        allocations: { type: array, items: { $ref: "#/components/schemas/Allocation" } }
    MergeRequest:
      type: object
      additionalProperties: false
      required: [sourceIds]
      properties:
        sourceIds: { type: array, minItems: 1, items: { type: string }, description: The tags merged away. }
        name: { type: string, description: Renames the tag kept; left out keeps its name. }
        budgetFrom: { type: string, description: 'A source id or "none"; needed when two or more sources have budgets and the kept tag has none.' }
        dryRun: { type: boolean, default: false }
    MergePreview:
      type: object
      required: [tag, sourceIds, transactions, affectedTransactions, duplicateLinks, templates, widgets, droppedNotificationKeys, budget, conflicts]
      properties:
        mergeId: { type: string, description: "For POST /api/tag-merges/{id}/undo; absent on a dry run." }
        tag: { $ref: "#/components/schemas/Tag" }
        sourceIds: { type: array, items: { type: string } }
        transactions: { type: integer }
        affectedTransactions: { type: integer }
        duplicateLinks: { type: integer }
        templates: { type: array, items: { type: string } }
        widgets: { type: array, items: { type: string } }
        droppedNotificationKeys: { type: integer }
        budget:
          type: object
          required: [outcome]
          properties:
            outcome: { type: string, enum: [target, source, none, choose] }
            from: { type: string }
            candidates: { type: array, items: { type: string } }
        conflicts: { type: array, items: { type: string } }
    Settings:
      type: object
      required: [dashboard, general, notifications, themes, about]
      properties:
        dashboard: { $ref: "#/components/schemas/DashboardSettings" }
        general: { $ref: "#/components/schemas/GeneralSettings" }
        notifications: { $ref: "#/components/schemas/NotificationSettings" }
        themes:
          description: Custom themes a device uploaded (ADR 0027); empty until one syncs.
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/CustomTheme" }
        about: { $ref: "#/components/schemas/AboutInfo" }
    DashboardSettings:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, type]
            properties:
              id: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
              type: { type: string, enum: [balances, budgets, spending, reserves, accounts, recent] }
              size: { type: string, enum: [full, half] }
              title: { type: string }
              rows: { type: integer, minimum: 0 }
              include: { type: array, items: { type: string } }
              columns: { type: array, items: { type: string } }
    GeneralSettings:
      type: object
      properties:
        defaultCurrency: { type: string, pattern: "^[A-Z]{3}$" }
        currencies: { type: array, maxItems: 50, items: { type: string, pattern: "^[A-Z]{3}$" } }
        language: { type: string, enum: ["", en, zh-TW] }
        pageWidth: { type: string, enum: [default, wide, full] }
        openDays: { type: integer, minimum: 1, maximum: 90 }
        timeZone: { type: string, description: 'An IANA zone; "" follows the device.' }
        numberFormat: { type: string, enum: [grouped, four, plain] }
        amountStyle: { type: string, enum: [both, sign, color] }
        theme:
          description: >-
            The selected theme, present only once a device syncs the selected
            theme (ADR 0027). The light/dark mode is never stored here.
          type: object
          required: [selected]
          properties:
            selected:
              type: string
              description: A built-in theme, or the id of one of themes.
              pattern: "^(default|contrast|warm|cool|thm-[a-z0-9]{6,32})$"
    NotificationSettings:
      type: object
      properties:
        dismissed: { type: array, maxItems: 500, items: { type: string, maxLength: 120 } }
    CustomTheme:
      description: >-
        A user's own theme (ADR 0027). light holds every colour of the theme by
        token name (without the leading --); dark only when split is on, and it
        is dropped otherwise. Colours are hex only; #rgb is stored as #rrggbb.
      type: object
      required: [id, name, basedOn, light, updatedAt]
      properties:
        id: { type: string, pattern: "^thm-[a-z0-9]{6,32}$" }
        name: { type: string, minLength: 1, maxLength: 60 }
        basedOn: { type: string, enum: [default, contrast, warm, cool] }
        split: { type: boolean, default: false }
        light: { $ref: "#/components/schemas/ThemeColours" }
        dark: { $ref: "#/components/schemas/ThemeColours" }
        updatedAt: { type: string, format: date-time }
    ThemeColours:
      type: object
      minProperties: 1
      maxProperties: 100
      propertyNames: { pattern: "^[a-z][a-z0-9-]{0,31}$" }
      additionalProperties: { type: string, pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$" }
    AboutInfo:
      type: object
      readOnly: true
      properties:
        sourceUrl: { type: string }
        version: { type: string }
        commit: { type: string }
        buildTime: { type: string }
        nightly: { type: boolean }
